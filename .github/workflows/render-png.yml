name: Render approved brand PNGs
on:
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: render-brand-assets
  cancel-in-progress: false
jobs:
  render:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - run: pip install --disable-pip-version-check cairosvg==2.8.2
      - run: python assets/render-assets.py
      - name: Commit rendered PNG counterparts
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add assets/otty-*.png
          if ! git diff --cached --quiet; then
            git commit -m 'Render PNG counterparts from approved Otty SVGs'
            git push
          fi
